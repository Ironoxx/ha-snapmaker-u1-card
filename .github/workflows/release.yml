name: Release

# New version = new release, no manual tagging:
# bump the version in manifest.json, const.py and frontend/src/const.js, add a
# "## <version>" section to CHANGELOG.md (becomes the release text that HACS
# shows), run `npm run build` and push to main. Versions ending in a1/b1/rc1
# (e.g. 1.5.0b1) become pre-releases: HACS offers them only to users who
# enabled "show beta versions" for this repository. If the tag v<version> does not exist yet,
# the tests run and then tag, release and zips are created
# (snapmaker_u1_card.zip for HACS + install zip).
# Manually: Actions -> Release -> Run workflow.
on:
  push:
    branches: [main]
    paths: ["custom_components/snapmaker_u1_card/manifest.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read version, already released?
        id: ver
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('custom_components/snapmaker_u1_card/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 1.5.0b1, 1.5.0rc1 ...: pre-release (HACS shows it only with "show beta versions")
          if echo "$VERSION" | grep -Eq '(a|b|rc)[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists - nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Version matches const.py and the card
        if: steps.ver.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          grep -q "VERSION = \"$V\"" custom_components/snapmaker_u1_card/const.py
          grep -q "CARD_VERSION = \"$V\"" custom_components/snapmaker_u1_card/frontend/snapmaker-u1-card.js
          grep -q "CARD_VERSION = \"$V\"" frontend/src/const.js
      - uses: actions/setup-python@v6
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - if: steps.ver.outputs.exists == 'false'
        run: pip install -r requirements_test.txt && ruff check custom_components && pytest -q
      - uses: actions/setup-node@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          node-version: "22"
      - if: steps.ver.outputs.exists == 'false'
        run: npm ci && npm run lint && npm test
      - name: Build zips
        if: steps.ver.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          (cd custom_components/snapmaker_u1_card && zip -qr "$GITHUB_WORKSPACE/snapmaker_u1_card.zip" . -x "__pycache__/*")
          zip -qr "snapmaker_u1_card-$V-install.zip" custom_components/snapmaker_u1_card -x "*/__pycache__/*"
      - name: Release notes from CHANGELOG.md
        if: steps.ver.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          awk -v v="## $V" '$0 == v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::CHANGELOG.md has no section '## $V'"; exit 1
          fi
          cat release_notes.md
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            snapmaker_u1_card.zip
            snapmaker_u1_card-*-install.zip
          body_path: release_notes.md
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.ver.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
