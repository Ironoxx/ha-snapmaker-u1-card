maintenance_done:
  fields:
    item:
      required: true
      selector:
        select:
          translation_key: maintenance_item
          options:
            - plate
            - nozzle
            - rails
            - belts
            - filter
    config_entry_id:
      selector:
        config_entry:
          integration: snapmaker_u1_card
