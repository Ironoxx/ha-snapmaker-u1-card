set_preference:
  fields:
    preference:
      required: true
      example: auto_replenish
      selector:
        select:
          options:
            - auto_replenish
            - replenish_ignore_color
            - entangle_detect
            - end_led_off
            - entangle_sensitivity
    value:
      required: true
      example: true
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: snapmaker_u1_card
set_filament:
  fields:
    slot:
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 4
          mode: box
    type:
      required: true
      example: PLA
      selector:
        text:
    sub_type:
      example: Silk
      selector:
        text:
    vendor:
      example: Generic
      selector:
        text:
    color:
      example: "#FF0000"
      selector:
        text:
    colors:
      example: '["#C0C0C0", "#FFD700"]'
      selector:
        text:
          multiple: true
    force:
      selector:
        boolean:
    config_entry_id:
      selector:
        config_entry:
          integration: snapmaker_u1_card
send_gcode:
  fields:
    script:
      required: true
      example: "M221 S95"
      selector:
        text:
          multiline: true
    config_entry_id:
      selector:
        config_entry:
          integration: snapmaker_u1_card
tool_change:
  fields:
    head:
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 4
          mode: box
    action:
      default: pick
      selector:
        select:
          translation_key: tool_change_action
          options:
            - pick
            - park
    config_entry_id:
      selector:
        config_entry:
          integration: snapmaker_u1_card
filament:
  fields:
    head:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box
    action:
      required: true
      default: unload
      selector:
        select:
          translation_key: filament_action
          options:
            - load
            - unload
    config_entry_id:
      selector:
        config_entry:
          integration: snapmaker_u1_card
move:
  fields:
    axis:
      selector:
        select:
          options:
            - x
            - y
            - z
    distance:
      example: 10
      selector:
        number:
          min: -100
          max: 100
          step: 0.1
          unit_of_measurement: mm
          mode: box
    position:
      selector:
        select:
          translation_key: move_position
          options:
            - center
            - front
    config_entry_id:
      selector:
        config_entry:
          integration: snapmaker_u1_card
weigh_spool:
  fields:
    slot:
      example: 2
      selector:
        number:
          min: 1
          max: 4
          mode: box
    spool_id:
      example: 12
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    weight:
      required: true
      example: 742
      selector:
        number:
          min: 0
          max: 10000
          step: 1
          unit_of_measurement: g
          mode: box
    gross:
      default: true
      selector:
        boolean:
    config_entry_id:
      selector:
        config_entry:
          integration: snapmaker_u1_card
create_spool:
  fields:
    slot:
      example: 2
      selector:
        number:
          min: 1
          max: 4
          mode: box
    material:
      example: PLA
      selector:
        text:
    filament_id:
      example: 12
      selector:
        number:
          min: 1
          max: 1000000
          mode: box
    external_id:
      example: polymaker_pla_polyterrapla_black_1000_175_n
      selector:
        text:
    location:
      example: Regal 2
      selector:
        text:
    vendor:
      example: Snapmaker
      default: Generic
      selector:
        text:
    name:
      example: PLA Matte Black
      selector:
        text:
    color:
      example: "#1a1a1a"
      selector:
        text:
    weight:
      default: 1000
      selector:
        number:
          min: 1
          max: 10000
          unit_of_measurement: g
          mode: box
    spool_weight:
      selector:
        number:
          min: 0
          max: 2000
          unit_of_measurement: g
          mode: box
    price:
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
    remaining:
      selector:
        number:
          min: 0
          max: 10000
          unit_of_measurement: g
          mode: box
    extruder_temp:
      example: 215
      selector:
        number:
          min: 150
          max: 350
          unit_of_measurement: °C
          mode: box
    bed_temp:
      example: 60
      selector:
        number:
          min: 0
          max: 150
          unit_of_measurement: °C
          mode: box
    density:
      example: 1.24
      selector:
        number:
          min: 0.5
          max: 3
          step: 0.01
          unit_of_measurement: g/cm³
          mode: box
    diameter:
      example: 1.75
      selector:
        number:
          min: 1
          max: 3
          step: 0.01
          unit_of_measurement: mm
          mode: box
    article_number:
      selector:
        text:
    lot_nr:
      selector:
        text:
    comment:
      selector:
        text:
          multiline: true
    extra:
      example: '{"dryer": "Box 2"}'
      selector:
        object:
    filament_extra:
      selector:
        object:
    config_entry_id:
      selector:
        config_entry:
          integration: snapmaker_u1_card
